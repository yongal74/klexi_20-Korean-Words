name: Android Build (AAB)

on:
  workflow_dispatch:  # 수동 실행
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}" >> .env
          echo "EXPO_PUBLIC_POLAR_MONTHLY_ID=${{ secrets.EXPO_PUBLIC_POLAR_MONTHLY_ID }}" >> .env
          echo "EXPO_PUBLIC_POLAR_YEARLY_ID=${{ secrets.EXPO_PUBLIC_POLAR_YEARLY_ID }}" >> .env
          echo "EXPO_PUBLIC_POLAR_LIFETIME_ID=${{ secrets.EXPO_PUBLIC_POLAR_LIFETIME_ID }}" >> .env

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build AAB
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwentyKorean-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
